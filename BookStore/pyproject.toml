[project]
name = "bookstore"
version = "0.1.0"
description = "BookStore API built with FastAPI"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "pydantic",
    "pydantic-settings",
    "email-validator",
    "pyjwt",
    "argon2-cffi",
    "alembic",
    "python-multipart",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

